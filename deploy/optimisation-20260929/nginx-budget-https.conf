upstream nos_deniers_web {
    zone nos_deniers_web 64k;
    least_conn;
    server 127.0.0.1:8552 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8556 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8557 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8558 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name budget.lexmachine.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nos-deniers-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name budget.lexmachine.net;
    ssl_certificate /etc/nginx/tls/nos-deniers/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/nos-deniers/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://nos_deniers_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 4;
    }
}
