upstream nos_deniers_web {
    zone nos_deniers_web 64k;
    least_conn;
    server 127.0.0.1:8552 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8556 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8557 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8558 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name budget.lexmachine.net;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nos-deniers-acme;
    }
    location / {
        proxy_pass http://nos_deniers_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 4;
    }
}
