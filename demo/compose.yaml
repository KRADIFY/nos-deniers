name: nos-deniers-demo
services:
  demo:
    build: .
    image: nos-deniers-demo:20261007-voix-textes
    ports:
      - "127.0.0.1:18896:8080"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
