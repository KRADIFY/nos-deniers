    # Only forwards anonymous signals; all statistics live on the old VPS.
    location ^~ /activity/ {
        access_log off;
        client_max_body_size 4k;
        proxy_pass https://109.199.112.132;
        proxy_set_header Host auditnosdeniers.lexmachine.net;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name auditnosdeniers.lexmachine.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
    }
    location = / {
        proxy_pass http://nos_deniers_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 4;
        sub_filter_once on;
        sub_filter ' documents,</strong>' ' documents</strong>';
        sub_filter 'href="https://plfss.lexmachine.net/"' 'href="https://plfss.lexmachine.net/demo/"';
        sub_filter '</head>' '<script src="/activity/script.js" async></script><link rel="stylesheet" href="/presentation/general.css"><link rel="stylesheet" href="/demo/gateway.css?v=20261005"><script src="/demo/gateway.js?v=20261005" defer></script><link rel="stylesheet" href="/presentation/entry-buttons.css?v=20261006"><link rel="stylesheet" href="/presentation/budget-refinements.css?v=20261006"><link rel="stylesheet" href="/presentation/header-alignment.css?v=20261006"><script src="/presentation/header-alignment.js?v=20261006" defer></script></head>';
        sub_filter '<nav class="legal-links" aria-label="Informations légales">' '<nav class="legal-links" aria-label="Informations légales"><a href="/activity/privacy">Mesure d’audience</a>';
    }

    # Independent guided demo. Removing this block and the gateway injection restores the original home page.
    location = /demo { return 302 /demo/; }
    location ^~ /demo/ {
        proxy_pass http://127.0.0.1:18896/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/presentation/entry-buttons.css?v=20261006"><link rel="stylesheet" href="/presentation/budget-refinements.css?v=20261006"><script src="/activity/script.js" async></script></head>';
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    # Shared design B for the four requested entry buttons.
    location = /presentation/entry-buttons.css {
        alias /opt/plfss-demo/releases/20261006-voix/public/entry-buttons.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    # Removable CSS for the requested cards, total row and navigation tabs.
    location = /presentation/budget-refinements.css {
        alias /opt/nos-deniers/presentations/budget-refinements.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    # Same anonymous counter; local adapter adds demo and inherited exclusion.
    location = /activity/script.js {
        access_log off;
        alias /opt/nos-deniers/presentations/audience-20261006/tracker.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Boolean preference only; restricted to the PLFSS parent origin.
    location = /activity/exclusion-bridge {
        access_log off;
        alias /opt/nos-deniers/presentations/audience-20261006/exclusion-bridge.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; frame-ancestors https://plfss.lexmachine.net; object-src 'none'; base-uri 'none'";
    }
    location = /activity/exclusion-bridge.js {
        access_log off;
        alias /opt/nos-deniers/presentations/audience-20261006/exclusion-bridge.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Requested masthead presentation; the original explorer assets stay unchanged.
    location = /presentation/header-alignment.css {
        alias /opt/nos-deniers/presentations/header-alignment.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    # Requested masthead presentation; the original explorer assets stay unchanged.
    location = /presentation/header-alignment.js {
        alias /opt/nos-deniers/presentations/header-alignment.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
