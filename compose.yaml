  "name": "lexmachine-budget",
  "services": {
    "web": {
      "build": ".",
      "image": "lexmachine-budget:0.3",
      "init": true,
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 64,
      "tmpfs": [
        "/tmp:size=32m,mode=1777"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:8552:8080"
      ],
      "volumes": [
        "budget_state:/state:ro",
        "budget_data:/data:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"
        ],
        "interval": "30s",
        "timeout": "5s",
        "retries": 3
      }
    },
